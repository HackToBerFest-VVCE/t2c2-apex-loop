# Builds the CivicLens Android app (APK) on GitHub's machines, which already have Java and the Android SDK.
# Run it from the repo's Actions tab ("Build Android APK" → "Run workflow"); the APK appears under
# the run's "Artifacts" when it finishes (about 5 minutes).
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'public/**', 'capacitor.config.json', 'package.json', '.env.app']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build the app's screens and copy them into the Android project
        run: |
          npm ci
          npm run build:app

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CivicLens-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
