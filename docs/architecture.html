<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CivicLens Architecture</title>
<style>
  html, body { margin: 0; background: #f6f7fb; }
  svg { display: block; font-family: 'Segoe UI', system-ui, sans-serif; }
  .title { font-size: 34px; font-weight: 700; fill: #101828; }
  .subtitle { font-size: 17px; fill: #475467; }
  .h { font-size: 19px; font-weight: 700; fill: #101828; }
  .t { font-size: 14.5px; fill: #475467; }
  .label { font-size: 13px; font-weight: 600; fill: #1f4fd8; paint-order: stroke; stroke: #f6f7fb; stroke-width: 7px; stroke-linejoin: round; }
  .step { font-size: 13px; font-weight: 700; fill: #fff; }
  .group { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; fill: #667085; }
</style>
</head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8" />
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#98a2b3" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#101828" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="60" y="70" class="title">CivicLens · Solution Architecture</text>
  <text x="60" y="102" class="subtitle">Photo → AI understands the problem → right authority → complaint drafted and sent automatically, with the photo, from the citizen's own Gmail</text>

  <!-- Column headers -->
  <text x="60" y="160" class="group">CITIZEN</text>
  <text x="380" y="160" class="group">CIVICLENS WEB APP (RUNS IN THE BROWSER)</text>
  <text x="1000" y="160" class="group">CLOUD SERVICES</text>
  <text x="1370" y="160" class="group">GOVERNMENT</text>

  <!-- Citizen -->
  <g filter="url(#shadow)">
    <rect x="60" y="300" width="250" height="250" rx="22" fill="#fff" stroke="#e4e7ec" />
  </g>
  <rect x="150" y="330" width="70" height="120" rx="14" fill="#eef2fd" stroke="#1f4fd8" stroke-width="2" />
  <rect x="160" y="345" width="50" height="78" rx="4" fill="#fff" stroke="#c7d4f7" />
  <circle cx="185" cy="437" r="5" fill="#1f4fd8" />
  <text x="185" y="488" class="h" text-anchor="middle">Any citizen</text>
  <text x="185" y="512" class="t" text-anchor="middle">Phone or laptop browser</text>
  <text x="185" y="532" class="t" text-anchor="middle">Nothing to install</text>

  <!-- Web app container -->
  <rect x="370" y="180" width="540" height="650" rx="24" fill="#ffffff" stroke="#1f4fd8" stroke-width="2" stroke-dasharray="0" filter="url(#shadow)" />

  <!-- Module: Capture -->
  <rect x="400" y="210" width="480" height="96" rx="14" fill="#f9fafb" stroke="#e4e7ec" />
  <circle cx="428" cy="240" r="14" fill="#1f4fd8" /><text x="428" y="245" class="step" text-anchor="middle">1</text>
  <text x="452" y="246" class="h">Capture photo + exact location</text>
  <text x="430" y="276" class="t">Photo resized in the browser · GPS from photo EXIF, else device GPS</text>
  <text x="430" y="296" class="t">(accuracy shown, e.g. ±8 m)</text>

  <!-- Module: Authority router -->
  <rect x="400" y="340" width="480" height="96" rx="14" fill="#f9fafb" stroke="#e4e7ec" />
  <circle cx="428" cy="370" r="14" fill="#1f4fd8" /><text x="428" y="375" class="step" text-anchor="middle">3</text>
  <text x="452" y="376" class="h">Authority router</text>
  <text x="430" y="406" class="t">Problem type + area → GBA city corporation, BWSSB,</text>
  <text x="430" y="426" class="t">BESCOM / CESC, city corporation or gram panchayat</text>

  <!-- Module: Letters -->
  <rect x="400" y="470" width="480" height="96" rx="14" fill="#f9fafb" stroke="#e4e7ec" />
  <circle cx="428" cy="500" r="14" fill="#1f4fd8" /><text x="428" y="505" class="step" text-anchor="middle">4</text>
  <text x="452" y="506" class="h">Bilingual complaint letter</text>
  <text x="430" y="536" class="t">Formal letter in English + ಕನ್ನಡ with address,</text>
  <text x="430" y="556" class="t">GPS coordinates and Google Maps link · editable</text>

  <!-- Module: Send -->
  <rect x="400" y="600" width="480" height="80" rx="14" fill="#f9fafb" stroke="#e4e7ec" />
  <circle cx="428" cy="630" r="14" fill="#1f4fd8" /><text x="428" y="635" class="step" text-anchor="middle">5</text>
  <text x="452" y="636" class="h">One-tap send</text>
  <text x="430" y="664" class="t">Both letters + the photo, no copy-paste</text>

  <!-- Module: Reports & hotspots -->
  <rect x="400" y="714" width="480" height="92" rx="14" fill="#fffaeb" stroke="#fedf89" />
  <text x="430" y="748" class="h">My Reports + Hotspots</text>
  <text x="430" y="774" class="t">Every report saved (IndexedDB) with status · charts by</text>
  <text x="430" y="794" class="t">problem type, severity and department</text>

  <!-- Internal flow arrows -->
  <path d="M640 436 L640 466" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrowGray)" />
  <path d="M640 566 L640 596" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrowGray)" />

  <!-- AI vision service -->
  <g filter="url(#shadow)">
    <rect x="1000" y="180" width="320" height="200" rx="20" fill="#eef2fd" stroke="#1f4fd8" stroke-width="2" />
  </g>
  <rect x="1020" y="198" width="280" height="40" rx="10" fill="#fff" stroke="#c7d4f7" />
  <text x="1160" y="224" class="t" text-anchor="middle">Serverless function · API key hidden</text>
  <circle cx="1032" cy="270" r="14" fill="#1f4fd8" /><text x="1032" y="275" class="step" text-anchor="middle">2</text>
  <text x="1056" y="276" class="h">AI vision model</text>
  <text x="1022" y="304" class="t">Multimodal AI model via API</text>
  <text x="1022" y="328" class="t">Image in → JSON out: problem type,</text>
  <text x="1022" y="348" class="t">severity, department, description</text>
  <text x="1022" y="368" class="t">in English + Kannada</text>

  <!-- OpenStreetMap -->
  <g filter="url(#shadow)">
    <rect x="1000" y="420" width="320" height="110" rx="20" fill="#fff" stroke="#e4e7ec" />
  </g>
  <text x="1022" y="458" class="h">OpenStreetMap</text>
  <text x="1022" y="486" class="t">GPS → street address, city</text>
  <text x="1022" y="506" class="t">corporation and district</text>

  <!-- Gmail -->
  <g filter="url(#shadow)">
    <rect x="1000" y="580" width="320" height="110" rx="20" fill="#fff" stroke="#e4e7ec" />
  </g>
  <text x="1022" y="618" class="h">Gmail API (Google sign-in)</text>
  <text x="1022" y="646" class="t">Sent from the citizen's own Gmail</text>
  <text x="1022" y="666" class="t">with the photo attached</text>

  <!-- Government -->
  <g filter="url(#shadow)">
    <rect x="1370" y="470" width="190" height="330" rx="20" fill="#ecfdf3" stroke="#a6e3bd" stroke-width="2" />
  </g>
  <text x="1465" y="510" class="h" text-anchor="middle">Right authority</text>
  <text x="1390" y="550" class="t">• GBA city</text>
  <text x="1404" y="570" class="t">corporations</text>
  <text x="1390" y="602" class="t">• BWSSB (water,</text>
  <text x="1404" y="622" class="t">sewage)</text>
  <text x="1390" y="654" class="t">• BESCOM / CESC</text>
  <text x="1404" y="674" class="t">(live wires)</text>
  <text x="1390" y="706" class="t">• City corporation /</text>
  <text x="1404" y="726" class="t">gram panchayat</text>
  <text x="1404" y="746" class="t">outside Bengaluru</text>

  <!-- Cross arrows -->
  <path d="M310 400 C345 400 345 258 396 258" fill="none" stroke="#1f4fd8" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="336" y="292" class="label" text-anchor="middle">snap photo</text>

  <path d="M880 240 C925 240 935 270 996 270" fill="none" stroke="#1f4fd8" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="938" y="232" class="label" text-anchor="middle">photo</text>

  <path d="M996 345 C930 345 930 380 884 380" fill="none" stroke="#1f4fd8" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="952" y="342" class="label" text-anchor="middle">result</text>

  <path d="M880 290 C935 290 930 470 996 470" fill="none" stroke="#1f4fd8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)" />
  <text x="972" y="438" class="label" text-anchor="middle">GPS</text>

  <path d="M996 505 C930 505 930 410 884 410" fill="none" stroke="#1f4fd8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)" />
  <text x="934" y="530" class="label" text-anchor="middle">address</text>

  <path d="M880 640 L996 640" fill="none" stroke="#1f4fd8" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="938" y="626" class="label" text-anchor="middle">letters + photo</text>

  <path d="M1320 635 L1366 635" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="1343" y="623" text-anchor="middle" class="label" style="fill:#16a34a">email</text>

  <!-- Scale-up path -->
  <rect x="60" y="870" width="1500" height="96" rx="20" fill="none" stroke="#98a2b3" stroke-width="1.5" stroke-dasharray="7 6" />
  <text x="90" y="905" class="group">SCALE-UP PATH</text>
  <text x="90" y="940" class="t" style="font-size:15.5px;fill:#344054">Shared database → ward-wise hotspot dashboard for the city</text>
  <text x="590" y="940" class="t" style="font-size:15.5px;fill:#344054">AI model can be self-hosted on government cloud</text>
  <text x="1120" y="940" class="t" style="font-size:15.5px;fill:#344054">Lightweight on-device model → offline mode</text>
</svg>
</body>
</html>
