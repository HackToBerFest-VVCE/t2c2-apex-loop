<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1012" />
    <title>CivicLens</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e1012;
        color: #e8e6e1;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: #a3a29d;
      }
      a {
        display: inline-block;
        background: #f5c518;
        color: #0e1012;
        font-weight: 700;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Signed in</h1>
      <p id="text">Taking you back to the CivicLens app…</p>
      <a id="open" href="civiclens://auth">Open CivicLens</a>
    </main>
    <script>
      // Google sign-in for the Android app ends here (in Chrome). This hands the one-time code to the app.
      const params = new URLSearchParams(location.hash.slice(1));
      const code = params.get('code');
      const error = params.get('error');
      const link = code
        ? `civiclens://auth?code=${encodeURIComponent(code)}`
        : `civiclens://auth?error=${encodeURIComponent(error || 'failed')}`;
      if (!code) {
        document.getElementById('title').textContent = "Sign-in didn't finish";
        document.getElementById('text').textContent = 'Go back to the app and try again.';
      }
      document.getElementById('open').href = link;
      history.replaceState(null, '', location.pathname); // don't leave the code in the address bar
      location.href = link;
    </script>
  </body>
</html>
